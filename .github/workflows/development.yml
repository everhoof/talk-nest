name: cd

on:
  push:
    branches:
      - develop

jobs:
  staging-deploy:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Set NODE_ENV
        run: NODE_ENV=$APP_NODE_ENV
        env:
          APP_NODE_ENV: ${{ secrets.STAGING_NODE_ENV }}

      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Get pnpm store directory path 🛠
        id: pnpm-cache-dir-path
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules 📦
        uses: actions/cache@v6
        id: pnpm-cache # use this to check for `cache-hit` (`steps.pnpm-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.pnpm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test --runInBand

      - name: Build project
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
            SendEnv APP_DIR
            SendEnv APP_NODE_ENV
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}

      - name: Create version file
        run: |
          echo "{\"version\": \"$(git rev-parse HEAD)\"}" > version.json

      - name: Tar files
        run: >
          tar --ignore-failed-read --exclude=./artifacts.tgz -czvf artifacts.tgz
          dist
          mail
          .env
          deploy.sh
          ecosystem.config.js
          environment.js
          package.json
          tsconfig.build.json
          tsconfig.json
          .nvmrc
          pnpm-lock.yaml
          pnpm-workspace.yaml
          version.json
          || [[ $? -eq 1 ]]

      - name: Copy dist files
        run: |
          echo -n "$UDP_MESSAGE" >/dev/udp/$SSH_HOST/62544
          ssh staging 'mkdir -p $APP_DIR'
          scp -r artifacts.tgz deploy.sh staging:$APP_DIR
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          UDP_MESSAGE: ${{ secrets.PRODUCTION_UDP_MESSAGE }}

      - name: Run deploy script
        run: ssh staging 'cd $APP_DIR && export NODE_ENV=$APP_NODE_ENV && bash deploy.sh'
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          APP_NODE_ENV: ${{ secrets.STAGING_NODE_ENV }}
